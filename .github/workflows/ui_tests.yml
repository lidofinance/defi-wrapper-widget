name: UI tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      stand_env:
        description: 'Stand environment'
        type: choice
        default: mainnet
        options:
          - mainnet
          - testnet
      rpc_url:
        description: 'Override fork RPC URL (optional — falls back to secrets.RPC_URL, then a public RPC)'
        required: false
        type: string
      wallet:
        description: 'wallet'
        type: choice
        default: walletconnect
        options:
          - walletconnect
          - metamask

jobs:
  ui_test:
    name: Run e2e tests(stv-pool/stv-steth/stv-strategy)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Caps the whole job if any step hangs: install, browser download, or a test.
    timeout-minutes: 90
    concurrency:
      group: ui-tests-${{ github.ref }}
      cancel-in-progress: true
    env:
      WALLET_NAME: ${{ (github.event_name == 'workflow_dispatch' && inputs.wallet) || 'walletconnect' }}
      TEST_WALLET_SEED_PHRASE: ${{ secrets.TEST_WALLET_SEED_PHRASE }}
      TEST_WALLET_PASSWORD: ${{ secrets.TEST_WALLET_PASSWORD }}
      WC_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
      RPC_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.rpc_url) || secrets.RPC_URL }}
      CHAIN_ID: ${{ (github.event_name == 'workflow_dispatch' && inputs.stand_env == 'testnet') && '560048' || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: corepack enable
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            tests/yarn.lock

      - name: Install widget dependencies
        run: yarn install --immutable

      - name: Install E2E dependencies
        run: yarn install --immutable
        working-directory: tests

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: true

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/yarn.lock') }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" == "true" ]; then
            yarn playwright install-deps chromium
          else
            yarn playwright install chromium --with-deps
          fi
        working-directory: tests

      # Chromium runs headed (browser-service default), so it needs a display.
      - name: Run E2E tests
        working-directory: tests
        run: |
          chain_name="mainnet"
          [ "$CHAIN_ID" = "560048" ] && chain_name="hoodi"

          rpc_source="public fallback"
          [ -n "$RPC_URL" ] && rpc_source="configured"

          {
            echo "## 🚀 E2E run"
            echo
            echo "- 🌐 Chain: $chain_name ($CHAIN_ID)"
            echo "- 👛 Wallet: $WALLET_NAME"
            echo "- 🔌 RPC: $rpc_source"
            echo "- 🌱 Branch: ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          xvfb-run --auto-servernum -- yarn test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
          retention-days: 5
